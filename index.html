const RANKS = [
  { min: 0, title: "Geography Newbie", emoji: "🌱" },
  { min: 10, title: "Map Reader", emoji: "🗺️" },
  { min: 25, title: "Globe Trotter", emoji: "✈️" },
  { min: 40, title: "World Traveler", emoji: "🧭" },
  { min: 60, title: "Explorer", emoji: "🔭" },
  { min: 80, title: "Geography Master", emoji: "🏆" },
  { min: 100, title: "World Champion", emoji: "👑" },
];

function getRank(points) {
  let rank = RANKS[0];
  for (const r of RANKS) { if (points >= r.min) rank = r; }
  return rank;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

        .grade-badge {
          display:inline-flex; align-items:center; gap:6px;
          background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
          border-radius:20px; padding:6px 14px; margin-bottom:16px;
          font-size:0.85rem; color:#94a3b8; cursor:pointer; transition:all 0.2s;
        }
        .grade-badge:hover { background:rgba(255,255,255,0.1); color:#e2e8f0; }
        .category-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .category-card {
          background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08);
          border-radius:16px; padding:24px 16px; text-align:center;
          cursor:pointer; transition:all 0.25s ease; position:relative; overflow:hidden;
        }
        .category-card:hover { background:rgba(255,255,255,0.09); border-color:rgba(255,255,255,0.15); transform:translateY(-2px); }
        .cat-icon { font-size:2.2rem; margin-bottom:10px; display:block; }
        .cat-label { font-family:'Fredoka',sans-serif; font-weight:600; font-size:1rem; color:#e2e8f0; }
        .cat-sub { font-size:0.75rem; color:#64748b; margin-top:4px; }
        .quiz-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
        .back-btn {
          background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
          color:#94a3b8; padding:8px 16px; border-radius:10px; cursor:pointer;
          font-family:'Quicksand',sans-serif; font-weight:600; font-size:0.85rem; transition:all 0.2s;
        }
        .back-btn:hover { background:rgba(255,255,255,0.1); color:#e2e8f0; }
        .q-counter { font-family:'Fredoka',sans-serif; font-weight:600; font-size:0.95rem; color:#94a3b8; }
        .streak-badge {
          background:linear-gradient(135deg,#f59e0b,#ef4444); color:#fff;
          padding:4px 12px; border-radius:20px; font-size:0.8rem; font-weight:700; font-family:'Fredoka',sans-serif;
        }
        .dots { display:flex; gap:6px; justify-content:center; margin-bottom:24px; }
        .dot { width:10px; height:10px; border-radius:50%; transition:all 0.3s; }
        .question-card {
          background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
          border-radius:20px; padding:28px 22px; margin-bottom:16px;
        }
        .question-text { font-family:'Fredoka',sans-serif; font-size:1.3rem; font-weight:600; color:#f1f5f9; line-height:1.4; text-align:center; }
        .options { display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
        .option {
          background:rgba(255,255,255,0.05); border:2px solid rgba(255,255,255,0.1);
          border-radius:14px; padding:16px 20px; cursor:pointer; transition:all 0.2s;
          font-family:'Quicksand',sans-serif; font-weight:600; font-size:1rem;
          color:#e2e8f0; text-align:left; display:flex; align-items:center; gap:12px;
        }
        .option:hover:not(.disabled) { background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.2); transform:translateX(4px); }
        .option.correct { background:rgba(34,197,94,0.15); border-color:#22c55e; color:#86efac; }
        .option.wrong { background:rgba(239,68,68,0.15); border-color:#ef4444; color:#fca5a5; }
        .option.disabled { cursor:default; opacity:0.6; }
        .option-letter {
          width:32px; height:32px; border-radius:8px; background:rgba(255,255,255,0.08);
          display:flex; align-items:center; justify-content:center;
          font-family:'Fredoka',sans-serif; font-weight:700; font-size:0.85rem; flex-shrink:0;
        }
        .option.correct .option-letter { background:rgba(34,197,94,0.3); }
        .option.wrong .option-letter { background:rgba(239,68,68,0.3); }
        .fact-box {
          background:linear-gradient(135deg,rgba(56,189,248,0.1),rgba(139,92,246,0.1));
          border:1px solid rgba(56,189,248,0.2); border-radius:16px;
          padding:18px 20px; margin-bottom:16px; animation:fadeUp 0.4s ease;
        }
        .fact-label { font-family:'Fredoka',sans-serif; font-weight:700; font-size:0.75rem; text-transform:uppercase; letter-spacing:1.5px; color:#38bdf8; margin-bottom:6px; }
        .fact-text { font-size:0.9rem; color:#cbd5e1; line-height:1.5; }
        .next-btn {
          width:100%; padding:16px; border-radius:14px; border:none;
          font-family:'Fredoka',sans-serif; font-weight:600; font-size:1.1rem;
          cursor:pointer; transition:all 0.25s; color:#fff;
        }
        .next-btn.primary { background:linear-gradient(135deg,#3b82f6,#8b5cf6); }
        .next-btn.primary:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(59,130,246,0.3); }
        .results-card {
          background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
          border-radius:24px; padding:32px 24px; text-align:center;
        }
        .results-score {
          font-family:'Fredoka',sans-serif; font-size:4rem; font-weight:700;
          background:linear-gradient(135deg,#38bdf8,#818cf8);
          -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1;
        }
        .results-label { font-size:1rem; color:#94a3b8; margin-top:4px; font-weight:600; }
        .results-msg { font-family:'Fredoka',sans-serif; font-size:1.3rem; font-weight:600; margin:20px 0; color:#f1f5f9; }
        .results-breakdown { display:flex; flex-direction:column; gap:8px; margin:20px 0; text-align:left; }
        .result-row {
          display:flex; align-items:center; gap:10px; padding:10px 14px;
          background:rgba(255,255,255,0.04); border-radius:10px; font-size:0.85rem; color:#cbd5e1;
        }
        .result-icon { font-size:1.1rem; flex-shrink:0; }
        .btn-row { display:flex; gap:10px; margin-top:20px; }
        .btn-row .next-btn { flex:1; }
        .next-btn.secondary { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12); }
        .next-btn.secondary:hover { background:rgba(255,255,255,0.12); }
        @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
        @keyframes slideIn { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:translateX(0)} }
        @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.03)} 100%{transform:scale(1)} }
        @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
        .anim-slideIn{animation:slideIn .35s ease} .anim-correct{animation:pop .4s ease}
        .anim-wrong{animation:shake .4s ease} .anim-fadeUp{animation:fadeUp .4s ease}
      `}</style>

      <div className="app">
        <div className="stars">
          {Array.from({length:40},(_,i)=>(
            <div key={i} className="star" style={{
              left:`${Math.random()*100}%`, top:`${Math.random()*100}%`,
              animationDelay:`${Math.random()*3}s`, opacity:Math.random()*0.5+0.1,
              width:`${Math.random()*2+1}px`, height:`${Math.random()*2+1}px`,
            }}/>
          ))}
        </div>
        <div className="content">

          {screen === "gradeSelect" && (
            <div className="anim-fadeUp">
              <div className="header">
                <div className="title">Geography Explorer</div>
                <div className="subtitle">Learn about our amazing world</div>
              </div>
              <div className="grade-title">What grade are you in?</div>
              <div className="grade-subtitle">Pick your grade to get started</div>
              <div className="grade-grid">
                {Object.entries(GRADE_INFO).map(([g, info]) => (
                  <div key={g} className="grade-card" onClick={() => selectGrade(Number(g))}>
                    <span style={{position:'absolute',left:0,top:0,bottom:0,width:4,background:info.color,borderRadius:'16px 0 0 16px'}}/>
                    <span className="grade-emoji">{info.emoji}</span>
                    <div className="grade-info">
                      <div className="grade-label">{info.label}</div>
                      <div className="grade-desc">{info.desc}</div>
                    </div>
                    <span className="grade-arrow">&rsaquo;</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {screen === "home" && grade && (
            <div className="anim-fadeUp">
              <div className="header">
                <div className="title">Geography Explorer</div>
                <div className="subtitle">Learn about our amazing world</div>
              </div>
              <div style={{textAlign:'center'}}>
                <div className="grade-badge" onClick={() => {setScreen("gradeSelect");setGrade(null);}}>
                  {GRADE_INFO[grade].emoji} {GRADE_INFO[grade].label} &middot; Change
                </div>
              </div>
              <div className="rank-bar">
                <span className="rank-emoji">{rank.emoji}</span>
                <div className="rank-info">
                  <div className="rank-title">{rank.title}</div>
                  <div className="rank-stats">{totalPoints} points &middot; {quizCount} quizzes &middot; Best streak: {bestStreak}</div>
                  <div className="progress-track"><div className="progress-fill" style={{width:`${progress}%`}}/></div>
                </div>
              </div>
              <div className="category-grid">
                {Object.entries(categories).map(([key, cat]) => (
                  <div key={key} className="category-card" onClick={() => startQuiz(key)}>
                    <span style={{position:'absolute',top:0,left:0,right:0,height:3,background:cat.color,borderRadius:'16px 16px 0 0'}}/>
                    <span className="cat-icon">{cat.icon}</span>
                    <div className="cat-label">{cat.label}</div>
                    <div className="cat-sub">10 questions</div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {screen === "quiz" && questions.length > 0 && (
            <div className={`anim-${animation}`} key={currentQ}>
              <div className="quiz-header">
                <button className="back-btn" onClick={() => setScreen("home")}>Back</button>
                <span className="q-counter">{currentQ+1} / {questions.length}</span>
                {streak >= 2 && <span className="streak-badge">{streak} streak</span>}
              </div>
              <div className="dots">
                {questions.map((_,i)=>(
                  <div key={i} className="dot" style={{
                    background: i<currentQ ? results[i]?.correct?'#22c55e':'#ef4444'
                      : i===currentQ ? CATEGORIES_BY_GRADE[grade]?.[category]?.color||'#3b82f6'
                      : 'rgba(255,255,255,0.15)',
                    transform: i===currentQ?'scale(1.3)':'scale(1)',
                  }}/>
                ))}
              </div>
              <div className="question-card">
                <div className="question-text">{questions[currentQ].q}</div>
              </div>
              <div className="options">
                {questions[currentQ].options.map((opt,i)=>{
                  let cls="option";
                  if(selected!==null){
                    if(i===questions[currentQ].answer) cls+=" correct";
                    else if(i===selected&&i!==questions[currentQ].answer) cls+=" wrong";
                    else cls+=" disabled";
                  }
                  return (
                    <div key={i} className={cls} onClick={()=>handleAnswer(i)}>
                      <span className="option-letter">{String.fromCharCode(65+i)}</span>{opt}
                    </div>
                  );
                })}
              </div>
              {showFact && (
                <div className="fact-box">
                  <div className="fact-label">Did you know?</div>
                  <div className="fact-text">{questions[currentQ].fact}</div>
                </div>
              )}
              {showFact && (
                <button className="next-btn primary" onClick={nextQuestion}>
                  {currentQ+1>=questions.length?"See Results":"Next Question"}
                </button>
              )}
            </div>
          )}

          {screen === "results" && (
            <div className="anim-fadeUp">
              <div className="results-card">
                <div className="results-score">{score}/{questions.length}</div>
                <div className="results-label">correct answers</div>
                <div className="results-msg">
                  {score===questions.length?"Perfect score! You are a geography genius!"
                    :score>=4?"Amazing job! Almost a perfect run!"
                    :score>=3?"Good work! Keep exploring to learn more!"
                    :"Nice try! Every explorer starts somewhere!"}
                </div>
                <div className="results-breakdown">
                  {results.map((r,i)=>(
                    <div key={i} className="result-row">
                      <span className="result-icon">{r.correct?"✅":"❌"}</span>
                      <span>{r.question}</span>
                    </div>
                  ))}
                </div>
                <div className="btn-row">
                  <button className="next-btn secondary" onClick={()=>setScreen("home")}>Home</button>
                  <button className="next-btn primary" onClick={()=>startQuiz(category)}>Play Again</button>
                </div>
              </div>
            </div>
          )}

        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(GeographyExplorer));
</script>
</body>
</html>
